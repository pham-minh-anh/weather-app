<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather app</title>
  </head>
  <body>
    <h1>Weather app</h1>
    <form>
      <label for="location">Search for a location</label>
      <input
        id="location"
        type="text"
        name="location"
        placeholder="For example: Hanoi"
      />
      <button type="submit">Search</button>
    </form>
    <div class="container">
      <p>Weather display here</p>
    </div>
  </body>
</html>
